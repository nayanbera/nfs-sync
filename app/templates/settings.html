{% extends "base.html" %}
{% block title %}Settings — NFS Sync{% endblock %}
{% block content %}
<div class="row justify-content-center">
<div class="col-lg-8">
  <form method="post">

    <!-- SMTP -->
    <div class="card shadow-sm mb-4">
      <div class="card-header fw-semibold"><i class="bi bi-envelope"></i> Email / SMTP</div>
      <div class="card-body">
        <div class="row g-3">
          <div class="col-md-8">
            <label class="form-label">SMTP host</label>
            <input name="smtp_host" class="form-control" value="{{ cfg.smtp_host }}"
                   placeholder="smtp.example.com">
          </div>
          <div class="col-md-4">
            <label class="form-label">Port</label>
            <input name="smtp_port" class="form-control" value="{{ cfg.smtp_port }}"
                   placeholder="587">
          </div>
          <div class="col-md-6">
            <label class="form-label">Username</label>
            <input name="smtp_user" class="form-control" value="{{ cfg.smtp_user }}">
          </div>
          <div class="col-md-6">
            <label class="form-label">Password</label>
            <input name="smtp_password" type="password" class="form-control"
                   placeholder="(leave blank to keep current)">
          </div>
          <div class="col-md-6">
            <label class="form-label">From address</label>
            <input name="smtp_from" class="form-control" value="{{ cfg.smtp_from }}"
                   placeholder="nfssync@example.com">
          </div>
          <div class="col-md-6">
            <label class="form-label">Notify email (recipient)</label>
            <input name="notify_email" class="form-control" value="{{ cfg.notify_email }}"
                   placeholder="admin@example.com">
          </div>
          <div class="col-12">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" name="smtp_tls"
                     id="smtp_tls" value="1" {% if cfg.smtp_tls %}checked{% endif %}>
              <label class="form-check-label" for="smtp_tls">Use STARTTLS</label>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- App URL -->
    <div class="card shadow-sm mb-4">
      <div class="card-header fw-semibold"><i class="bi bi-link-45deg"></i> Application URL</div>
      <div class="card-body">
        <label class="form-label">Base URL</label>
        <input name="base_url" class="form-control" value="{{ cfg.base_url }}"
               placeholder="http://hostname:5050">
        <div class="form-text">Used to build log links in notification emails.</div>
      </div>
    </div>

    <!-- Admin credentials -->
    <div class="card shadow-sm mb-4">
      <div class="card-header fw-semibold"><i class="bi bi-person-lock"></i> Admin credentials</div>
      <div class="card-body">
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label">Username</label>
            <input name="admin_username" class="form-control" value="{{ cfg.admin_username }}">
          </div>
          <div class="col-md-6"></div>
          <div class="col-md-6">
            <label class="form-label">New password</label>
            <input name="new_password" type="password" class="form-control"
                   placeholder="(leave blank to keep current)">
          </div>
          <div class="col-md-6">
            <label class="form-label">Confirm password</label>
            <input name="confirm_password" type="password" class="form-control">
          </div>
        </div>
      </div>
    </div>

    <!-- Timezone -->
    <div class="card shadow-sm mb-4">
      <div class="card-header fw-semibold"><i class="bi bi-clock"></i> Display timezone</div>
      <div class="card-body">
        <label class="form-label">Timezone</label>
        <select name="timezone" class="form-select">
          {% set tzones = [
            ("America/New_York",    "Eastern  — New York / Boston (ET)"),
            ("America/Chicago",     "Central  — Chicago / Houston (CT)"),
            ("America/Denver",      "Mountain — Denver / Phoenix (MT)"),
            ("America/Los_Angeles", "Pacific  — Los Angeles / Seattle (PT)"),
            ("America/Anchorage",   "Alaska (AKT)"),
            ("Pacific/Honolulu",    "Hawaii (HT)"),
            ("UTC",                 "UTC"),
            ("Europe/London",       "London (GMT/BST)"),
            ("Europe/Paris",        "Central Europe (CET/CEST)"),
            ("Asia/Tokyo",          "Japan (JST)"),
            ("Asia/Shanghai",       "China (CST)"),
            ("Australia/Sydney",    "Sydney (AEST/AEDT)"),
          ] %}
          {% for tz_val, tz_label in tzones %}
          <option value="{{ tz_val }}" {% if cfg.timezone == tz_val %}selected{% endif %}>
            {{ tz_label }}
          </option>
          {% endfor %}
        </select>
        <div class="form-text">All timestamps in the UI are displayed in this timezone.</div>
      </div>
    </div>

    <button class="btn btn-primary"><i class="bi bi-save"></i> Save settings</button>

  </form>
</div>
</div>
{% endblock %}
