[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nfs-sync"
version = "0.1.0"
description = "Web app for one-way NFS folder syncing via rsync, with scheduled jobs and email alerts"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "Flask>=3.0",
    "Flask-Login>=0.6",
    "Flask-SQLAlchemy>=3.1",
    "APScheduler>=3.10",
    "Werkzeug>=3.0",
]

[project.scripts]
nfs-sync = "app.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.setuptools.package-data]
"app" = ["templates/**/*.html"]
